const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const P=new URLSearchParams(location.search);
const TABLE=(P.get("table")||(location.hash.match(/table-(\d+)/)||[])[1]||"01").padStart(2,"0");
const S={lang:LS("sd_lang"),cart:LS("sd_cart")||{},order:LS("sd_order"),chat:[],ov:null,flt:"all",stg:-1};
const t=k=>(L[S.lang]||L.en)[k]??L.en[k];
const spl=m=>t(["mild","med","hot"][m.s]);const byId=i=>M.find(m=>m.id==i);

// ---- Recommendation engine (rule-based; swap this function for an LLM call behind a server endpoint later) ----
function recommend(q){q=q.toLowerCase();
 let b=(q.match(/(?:under|below|within|budget|less than|upto|up to|₹|rs\.?|inr)\s*₹?\s*(\d{2,5})/)||[])[1];b=b?+b:null;
 const nv=/non[- ]?veg|chicken|biryani|meat|मांसाहारी/.test(q),v=!nv&&/veg|शाकाहारी/.test(q),pro=/protein/.test(q),mild=/mild/.test(q),ka=/karnataka|traditional/.test(q),combo=/meal|combo|combination|dinner|lunch|breakfast/.test(q),ex=/explore|unfamiliar/.test(q);
 let r=M.filter(m=>(!b||m.p<=b)&&(!nv||!m.v)&&(!v||m.v)&&(!pro||m.pr>=2)&&(!mild||m.s<=1)&&(!ka||m.k));
 if(ex)r=M.filter(m=>[4,5,7,9].includes(m.id)&&(!b||m.p<=b));
 if(mild)r.sort((a,c)=>a.s-c.s);if(pro||combo)r.sort((a,c)=>c.pr-a.pr||a.p-c.p);
 let tot=0;
 if(combo){const o=[];for(const m of r)if(o.length<3&&(!b||tot+m.p<=b)){o.push(m);tot+=m.p}r=o}else r=r.slice(0,4);
 const why=m=>[m.v?t("veg"):t("nv"),spl(m),b?"≤ ₹"+b:"",pro&&m.pr>=2?"High protein":"",ka?"Karnataka":""].filter(Boolean).join(" · ");
 return{items:r.map(m=>({m,why:why(m)})),total:combo&&r.length?tot:0}}

const IMG={1:"https://www.palatesdesire.com/wp-content/uploads/2019/09/Mysore_Masala_Dosa@Palates_Desire-1024x738.jpg",2:"",3:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJvqTiYLyqOQZD2RBkCYDEPX3QTsyB9lu8K1tQOa1VrA&s=10",4:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYTsqzzmbljCIYoFBK3VgKRGcdM6-feQL6JIx7q8ZxUw&s=10",5:"https://www.indianhealthyrecipes.com/wp-content/uploads/2021/02/ragi-mudde-recipe.jpg",6:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqxJL0wwPqmsahuSWbTMv5SNg2itDypBbGFTg55fGOsJ_gEerdYWjqtSc&s=10",7:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfUUZAGy8zVQo6oSgJXYwklWNaYFoHJcrtb8j3xgPqSADHKkR8CuQIKC81&s=10",8:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQb4XwA696QSTn8DiMXNJe6r5GwQoNN6FBqI851AGSnYQ&s=10",9:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReloXZbkLz73OgIWE5LMf5pG9zKB-HU7y8RUqZ3d23n3_2zIEUvrZciuE&s=10",10:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqisl7JGiy36sxyvj2YSrWlosEoMDtiM783wZ601l0vA&s=10",11:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeZ-TqdD0JvEmyzcm54irchnSjr3N-Pf0iWKr80CyO9Q&s=10",12:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdlPCW0l2Or0e9VVTIPvmukZT-XkZmLi-ZS7xooEIhFA&s=10",13:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQdnKHG0doiZWXVp7rtR8Sx1qcIahEHhcEdKaXal1ayBGAjvByloZtK70&s=10",14:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQnZwrLgWplOZu_M3DGhHNb8xDo2GgT2XwyIR2zl7nAGR8dCaCiKaOaFI&s=10",15:"",16:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScn2ZJQAPGyo11tMu9hnxwy6JTWNgpF_a-lKOcx2actg&s=10"};

const ph=(m,st="")=>`<div class="ph" style="--h:${m.h};${st}"><span>${m.e}</span>${IMG[m.id]?`<img src="${IMG[m.id]}" alt="${m.n}" loading="lazy" onerror="this.remove()">`:""}</div>`;
// ---- UI ----
function card(m,why,small){return`<div class="fc">${ph(m)}<h3><span>${dot(m)}${esc(m.n)}</span><span class="pr">₹${m.p}</span></h3><p>${esc(m.d)}</p>${why?`<div class="why">${esc(why)}</div>`:""}<div class="bt"><button class="p2" data-a="know" data-i="${m.id}">${t("know")}</button><button class="p1" data-a="add" data-i="${m.id}">${t("add")}</button></div></div>`}
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const sum=()=>Object.entries(S.cart).reduce((a,[i,q])=>a+byId(i).p*q,0);
function rend(){
 $("#hd").innerHTML=`<div class="sf" style="font-size:30px">🍛</div><div class="b"><h1>Ramaiah Restaurant</h1><small>SmartDine · Table ${TABLE}</small></div>${S.order?`<button class="ib" data-a="track" aria-label="Order">⏱</button>`:""}<button class="ib" data-a="openlang" aria-label="Language">🌐</button><button class="ib" data-a="cart" aria-label="Cart">🛒${cnt()?`<i>${cnt()}</i>`:""}</button>`;
 const msgs=S.chat.map(c=>c.typing?`<div class="row"><div class="av">🤖</div><div class="m b dots"><span></span><span></span><span></span></div></div>`:c.r=="u"?`<div class="m u">${esc(c.t)}</div>`:`<div class="row" style="align-items:flex-start"><div class="av">🤖</div><div style="flex:1;min-width:0"><div class="m b">${esc(c.t)}</div>${(c.items||[]).map(x=>card(x.m,x.why)).join("")}${c.total?`<div class="m b" style="margin-top:8px"><b>${t("total")}: ₹${c.total}</b></div>`:""}</div></div>`).join("");
 $("#chat").innerHTML=`<div class="hero"><div class="lg">🪔</div><h2>Ramaiah Restaurant</h2><p>${t("tag")}</p><span class="tb">Table ${TABLE}</span></div>`+msgs;
 const ch=CH[S.lang]||CH.en;$("#chips").innerHTML=ch.map((c,i)=>`<button data-a="chip" data-i="${i}">${esc(c)}</button>`).join("");
 $("#q").placeholder=t("ask");$("#mn").textContent=t("menu");
 const c=$("#chat");c.scrollTop=c.scrollHeight;ovr()}
function ovr(){let o=S.ov,h="";
 if(!S.lang)o="lang";
 if(o=="lang")h=`<div class="sh"><h2>Welcome to Ramaiah Restaurant!</h2><p style="color:var(--mu);margin:0">Choose your preferred language to explore our menu.</p><div class="lg2">${Object.keys(L).map(k=>`<button data-a="lang" data-i="${k}">${L[k].n}${k!="en"?`<small>${["","Hindi","Kannada","Tamil","Telugu","Malayalam"][Object.keys(L).indexOf(k)]}</small>`:""}</button>`).join("")}</div></div>`;
 else if(o=="menu"){const l=M.filter(m=>S.flt=="all"||(S.flt=="v")==!!m.v);h=`<div class="sh full"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${t("menu")}</h2><button class="ib p1" data-a="close" aria-label="Close">✕</button></div><div class="tabs">${[["all",t("all")],["v",t("veg")],["n",t("nv")]].map(([k,l])=>`<button class="${S.flt==k?"on":""}" data-a="flt" data-i="${k}">${l}</button>`).join("")}</div><div class="mg">${l.map(m=>card(m)).join("")}</div></div>`}
 else if(o=="cart"){const e=Object.entries(S.cart);h=`<div class="sh"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${t("cart")} · Table ${TABLE}</h2><button class="ib p1" data-a="close" aria-label="Close">✕</button></div>${e.length?e.map(([i,q])=>{const m=byId(i);return`<div class="ci"><span class="e">${m.e}</span><div class="n"><b>${m.n}</b><br><span class="pr">₹${m.p} × ${q} = ₹${m.p*q}</span></div><div class="q"><button data-a="dec" data-i="${i}">−</button><b>${q}</b><button data-a="inc" data-i="${i}">+</button></div><button data-a="rm" data-i="${i}" aria-label="Remove" style="background:none;font-size:20px">🗑</button></div>`}).join("")+`<div class="tot"><span>${t("total")}</span><span>₹${sum()}</span></div><button class="big" data-a="place">${t("place")}</button>`:`<p style="text-align:center;padding:30px 0;color:var(--mu)">${t("empty")}</p><button class="big" data-a="menu">${t("menu")}</button>`}</div>`}
 else if(o&&o[0]=="d"){const m=byId(o.slice(2));h=`<div class="sh">${ph(m,"font-size:72px")}<h2 style="margin-top:10px">${dot(m)}${m.n.toUpperCase()}</h2><p style="margin:4px 0">${m.d}</p><div class="cardb"><div><span>${t("ing")}</span></div><p style="margin:0">${m.i}.</p></div><div class="cardb"><div><span>${t("how")}</span></div><p style="margin:0">${m.w}</p></div><div class="cardb"><div><span>${t("sp")}</span><b>${"🌶".repeat(m.s+1)} ${spl(m)}</b></div><div><span>${m.v?t("veg"):t("nv")}</span><b class="pr">₹${m.p}</b></div></div><div class="bt"><button class="p2" data-a="close">${t("back")}</button><button class="p1" data-a="add" data-i="${m.id}">${t("add")}</button></div></div>`}
 else if(o=="order"&&S.order){const od=S.order,done=Date.now()-od.t>=600000;h=`<div class="sh full"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${t("ok")}</h2><button class="ib p1" data-a="close" aria-label="Close">✕</button></div><div class="cardb"><div><span>Order ID</span><b>${od.id}</b></div><div><span>Table</span><b>${TABLE}</b></div>${od.items.map(x=>`<div><span>${x.q} × ${x.n}</span><span>₹${x.p*x.q}</span></div>`).join("")}<div style="border-top:1px solid var(--bd);margin-top:6px;padding-top:6px"><b>${t("total")}</b><b class="pr">₹${od.total}</b></div></div>${done?`<div class="cf">🎉🍛✨</div><h2 style="text-align:center;margin:10px 0">${t("arrived")}</h2>`:`<div class="cook">🍳</div><div class="cd" id="cd">10:00</div><p style="text-align:center;margin:0;font-weight:600">${t("prep")}</p>`}<div class="pg">${t("st").map((s,i)=>`<div class="${i<S.stg||done?"d":i==S.stg?"c":""}"><b>${i<S.stg||done?"✓":i+1}</b>${s}</div>`).join("")}</div><p style="text-align:center;color:var(--mu);font-size:13px">${t("est")}</p>${done?`<button class="big" data-a="neu">${t("neu")}</button>`:""}</div>`}
 $("#ov").innerHTML=h?`<div class="ov" data-ov="1">${h}</div>`:""}
function tick(){const od=S.order;if(!od)return;const e=Date.now()-od.t,rem=Math.max(0,600000-e),g=rem==0?3:e<5000?0:e<420000?1:2;
 const el=$("#cd");if(el){const s=Math.ceil(rem/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
 if(g!=S.stg){S.stg=g;if(S.ov=="order")ovr()}}
function toast(x){const d=document.createElement("div");d.id="tt";d.textContent=x;$("#app").appendChild(d);setTimeout(()=>d.remove(),1200)}
function bot(text,items,total){S.chat.push({typing:1});rend();setTimeout(()=>{S.chat=S.chat.filter(c=>!c.typing);S.chat.push({r:"b",t:text,items,total});rend()},700)}
function send(q){q=q.trim();if(!q)return;S.chat.push({r:"u",t:q});const r=recommend(q);bot(r.items.length?t("found"):t("none"),r.items,r.total)}
function welcome(){S.chat=[{r:"b",t:t("hello")}]}
document.addEventListener("click",e=>{const a=e.target.closest("[data-a]");
 if(!a){if(e.target.dataset.ov&&S.lang){S.ov=null;ovr()}return}
 const i=a.dataset.i,x=a.dataset.a;
 if(x=="lang"){S.lang=i;LS("sd_lang",i);S.ov=null;document.documentElement.lang=i;welcome();rend()}
 else if(x=="openlang"){S.ov="lang";ovr()}
 else if(x=="menu"){S.ov="menu";ovr()}else if(x=="cart"){S.ov="cart";ovr()}
 else if(x=="close"){S.ov=null;ovr()}else if(x=="know"){S.ov="d:"+i;ovr()}
 else if(x=="flt"){S.flt=i;ovr()}
 else if(x=="add"||x=="inc"){S.cart[i]=(S.cart[i]||0)+1;save();if(x=="add")toast("✓ "+byId(i).n);rend()}
 else if(x=="dec"){S.cart[i]=(S.cart[i]||0)-1;if(S.cart[i]<1)delete S.cart[i];save();rend()}
 else if(x=="rm"){delete S.cart[i];save();rend()}
 else if(x=="chip"){send(CQ[i])}
 else if(x=="send"){const q=$("#q");send(q.value);q.value=""}
 else if(x=="place"){const it=Object.entries(S.cart).map(([i,q])=>({n:byId(i).n,p:byId(i).p,q}));if(!it.length)return;
  S.order={id:"SD-"+TABLE+"-"+Math.floor(1000+Math.random()*9000),t:Date.now(),items:it,total:sum()};S.cart={};S.stg=-1;save();S.ov="order";rend();tick()}
 else if(x=="track"){S.ov="order";ovr();tick()}
 else if(x=="neu"){S.order=null;save();S.ov=null;rend()}});
// ---- QR page (open with #qr) ----
function qrPage(){const base=()=>LS("sd_base")||location.origin+location.pathname;
 document.body.innerHTML=`<div class="qr"><div style="font-size:44px">🍛</div><h1>SmartDine</h1><h2 class="sf">Ramaiah Restaurant</h2><div id="qc"></div><h2>SCAN TO EXPERIENCE SMARTDINE</h2><p style="font-size:20px;color:var(--s);margin:6px 0 20px">Explore. Discover. Order.</p><p id="u" style="word-break:break-all;color:var(--mu);font-size:13px"></p><label style="display:block;text-align:left;font-size:13px;color:var(--mu)">Public app URL (update after deploying)<input id="bu" value=""></label><div class="bt"><button class="p1" id="ub">Update QR</button></div></div>`;
 const draw=()=>{const url=base().split("#")[0].split("?")[0]+"?table=01";$("#qc").innerHTML="";new QRCode($("#qc"),{text:url,width:260,height:260,colorDark:"#1F4D36",colorLight:"#ffffff"});$("#u").textContent=url};
 $("#bu").value=base();$("#ub").onclick=()=>{LS("sd_base",$("#bu").value.trim());draw()};draw()}
if(location.hash=="#qr")qrPage();else{
 $("#app").innerHTML=`<div id="hd"></div><div id="chat"></div><div id="chips"></div><div class="bar"><button class="mn" id="mn" data-a="menu"></button><input id="q" autocomplete="off"><button class="sd" data-a="send" aria-label="Send">➤</button></div><div id="ov"></div>`;
 $("#q").addEventListener("keydown",e=>{if(e.key=="Enter"){send(e.target.value);e.target.value=""}});
 if(S.lang)document.documentElement.lang=S.lang;welcome();rend();setInterval(tick,250);tick()}
